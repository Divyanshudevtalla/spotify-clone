<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    </head>
<body>
    <nav>
        <ul>
            <li class="brand"><img src="images\Spotify_Primary_Logo_RGB_Green.png" alt="Spotify">Spotify</li>
            <li><a href="home">Home</a></li>
            <li><a href="about">About</a></li>
            <li><a href="services">Services</a></li>
            <li><a href="contact">Contact</a></li>
        </ul>
    </nav>

    <div class="container">
        <h1>Welcome to Spotify</h1>
        <p>Discover millions of songs and podcasts.</p> 
        <div class="songList">
            <article class="song-card">
                <img class="song-cover" src="images/1708844206-mdl_beast_jb_2022_12_04_02_1400-2386_alivecoverage.avif" alt="Alive cover">
                <div>
                    <h2>Alive</h2>
                    <p>Featured song</p>
                    <button type="button" class="song-play" data-song-index="0">Play song</button>
                </div>
            </article>
            <article class="song-card">
                <img class="song-cover" src="images/DJI_0041.webp" alt="Next song cover">
                <div>
                    <h2>Next</h2>
                    <p>Featured song</p>
                    <button type="button" class="song-play" data-song-index="1">Play song</button>
                </div>
            </article>
        </div>
        <div class="songbanner"></div>
        <audio id="audioPlayer" preload="metadata">
            <source id="audioSource" src="songs/song.mp3" type="audio/mpeg">
        </audio>
        <div class="bottom">
            <div class="progress-row">
                <span id="currentTime">0:00</span>
                <input type="range" name="range" id="range" min="0" max="100" value="0" aria-label="Song progress">
                <span id="duration">0:00</span>
            </div>
            <div class="icons">
                <button type="button" class="player-button" id="previousButton" aria-label="Previous song">&#9664;&#9664;</button>
                <button type="button" class="play-toggle" id="playToggle" aria-label="Play song" aria-pressed="false">
                    <img id="playIcon" src="images/play-button-arrowhead.png" alt="Play button" width="24" height="24">
                </button>
                <button type="button" class="player-button" id="nextButton" aria-label="Next song">&#9654;&#9654;</button>
                <i class="fas fa-download"></i>
                <i class="fas fa-share"></i>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
